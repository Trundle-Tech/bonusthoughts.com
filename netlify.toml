# Static export of the Next.js app (next.config.ts: output "export").
# The site is plain HTML/JS/CSS in `out/`, so the Netlify Next.js runtime plugin
# is not needed and stays skipped. The private briefing is at /briefing/ and reads
# Firestore from the browser (Google sign-in, owner-only rules).
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  # Firebase web configs (apiKey etc.) are public by design; access is enforced by
  # Firebase Auth + Firestore rules. Exempt them from the secrets scanner.
  SECRETS_SCAN_OMIT_PATHS = "lib/firebase.ts,lib/briefing/firebase-config.json,site/app.js,site/firebase-config.json,out/_next/**"

# Internal tooling that lives in site/ is no longer published (publish dir is out/),
# so the old 404 redirects for site/ files are not needed.
