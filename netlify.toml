# Netlify config for the briefing branch (briefing-build).
# Publishes the static site/ directory with no build step. This overrides the
# old Next.js build for any deploy of this branch.
[build]
  publish = "site"
  command = ""

# The repo still has the old Next.js app; skip the Next.js runtime plugin so
# it does not try to build it for this static branch.
# The Firebase web config (apiKey etc.) is public by design (access is enforced
# by Firebase Auth + Firestore rules), so exempt just those two files from the
# secrets scanner.
[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  SECRETS_SCAN_OMIT_PATHS = "site/app.js,site/firebase-config.json"

# Don't serve internal tooling/config files that live inside site/.
[[redirects]]
  from = "/push_briefing.mjs"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/firestore.rules"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/firestore.indexes.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/firebase.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.firebaserc"
  to = "/404.html"
  status = 404
  force = true
