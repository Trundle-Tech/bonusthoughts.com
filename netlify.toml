# Netlify config for the briefing branch (briefing-build).
# Publishes the static site/ directory with no build step. This overrides the
# old Next.js build for any deploy of this branch.
[build]
  publish = "site"
  command = ""

# Don't serve internal tooling/config files that live inside site/.
[[redirects]]
  from = "/push_briefing.mjs"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/firestore.rules"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/firestore.indexes.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/firebase.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.firebaserc"
  to = "/404.html"
  status = 404
  force = true
